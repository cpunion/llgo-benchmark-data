<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLGo baseline benchmarks</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script defer src="dashboard.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">Continuous performance</p>
          <h1>LLGo baseline benchmarks</h1>
        </div>
        <a id="repository-link" class="repository-link" rel="noopener">Repository</a>
      </div>
    </header>

    <main>
      <section class="series-controls" aria-label="Benchmark history">
        <div id="kind-tabs" class="segmented" role="tablist">
          <button type="button" data-kind="main" role="tab" aria-selected="true">Main</button>
          <button type="button" data-kind="branch" role="tab" aria-selected="false">Branches</button>
          <button type="button" data-kind="pull" role="tab" aria-selected="false">Pull requests</button>
        </div>
        <label class="series-picker">
          <span>Series</span>
          <select id="series-select"></select>
        </label>
      </section>

      <section class="series-summary" aria-live="polite">
        <div>
          <p id="series-kind" class="eyebrow"></p>
          <h2 id="series-title">Loading benchmark history...</h2>
        </div>
        <div class="series-meta">
          <a id="commit-link" rel="noopener"></a>
          <time id="updated-at"></time>
        </div>
      </section>

      <nav id="category-tabs" class="category-tabs" aria-label="Benchmark categories"></nav>
      <p id="status" class="status" role="status"></p>
      <section id="charts" class="charts" aria-label="Benchmark charts"></section>
    </main>
  </body>
</html>
